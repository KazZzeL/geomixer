name: Test

on:
  workflow_call:
    inputs:
      test_report_name:
        description: "Artifact name for upload"
        required: false
        type: string
        default: test-report
      test_report_ttl:
        description: "Artifact TTL (days)"
        required: false
        type: number
        default: -1
      cvrg_report_name:
        description: "Artifact name for upload"
        required: false
        type: string
        default: cvrg-report
      cvrg_report_ttl:
        description: "Artifact TTL (days)"
        required: false
        type: number
        default: -1

permissions: {}

env: {}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    permissions:
      contents: read # for actions/checkout
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest # needs cpu
    env:
      TEST_REPORT_NAME: ${{ inputs.test_report_name }}
      CVRG_REPORT_NAME: ${{ inputs.cvrg_report_name }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install gotestsum
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        env:
          GOTESTSUM_VER: ${{ vars.GOTESTSUM_VER || 'v1.13.0' }}
        with:
          repo: gotestyourself/gotestsum
          tag: ${{ env.GOTESTSUM_VER }}
          prerelease: false
          chmod: 0755
          cache: true

      - name: Run gotestsum
        run: |
          gotestsum \
            --format testname \
            --junitfile "$TEST_REPORT_NAME" \
            -- -cover \
              -covermode=atomic \
              -coverprofile="$CVRG_REPORT_NAME" \
              -count=1 \
              -race \
              ./...

      - name: Upload test results
        if: ${{ !cancelled() && inputs.test_report_ttl >= 0 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.TEST_REPORT_NAME }}
          path: ${{ env.TEST_REPORT_NAME }}
          if-no-files-found: error
          retention-days: ${{ inputs.test_report_ttl }}
          overwrite: true

      - name: Upload coverage results
        if: ${{ !cancelled() && inputs.cvrg_report_ttl >= 0 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CVRG_REPORT_NAME }}
          path: ${{ env.CVRG_REPORT_NAME }}
          if-no-files-found: error
          retention-days: ${{ inputs.cvrg_report_ttl }}
          overwrite: true
