name: PR

on:
  pull_request:
    branches: ["master"]

permissions: {}

env: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
  queue: single

jobs:
  commits_naming:
    name: Сheck commits naming
    permissions:
      contents: read # for actions/checkout
    runs-on: ubuntu-slim
    steps:
      - name: Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Run commitlint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx --yes \
            -p @commitlint/cli@21.2.1 \
            -p @commitlint/config-conventional@21.2.0 \
            commitlint \
              --config .commitlintrc.yaml \
              --from "$BASE_SHA" \
              --to "$HEAD_SHA" \
              --verbose

  code_cleanliness:
    name: Сheck code cleanliness
    permissions:
      contents: read # for actions/checkout
    runs-on: ubuntu-slim
    steps:
      - name: Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check go mod tidy
        run: go mod tidy --diff

      - name: Check generated files are up to date
        run: |
          go generate ./...
          git diff --exit-code -- jsonschema/

  code_vulncheck:
    name: Check code vulnerabilities
    permissions:
      contents: read # for actions/checkout
    runs-on: ubuntu-slim
    steps:
      - name: Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run govulncheck
        env: 
          GOVULNCHECK_VER: ${{ vars.GOVULNCHECK_VER || 'v1.1.4' }}
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VER} \
            -mode=source \
            -show=color,verbose \
            -format=text \
            ./...

  workflows_vulncheck:
    name: Check workflows vulnerabilities
    permissions:
      contents: read # for actions/checkout
    runs-on: ubuntu-latest # for zizmorcore/zizmor-action: needs docker
    steps:
      - name: Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true
          color: true

  gitleaks:
    name: Check hardcoded credentials
    permissions:
      contents: read # for actions/checkout
      pull-requests: write # for gitleaks/gitleaks-action
    runs-on: ubuntu-slim
    steps:
      - name: Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
